name: Publish fork image

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Seekeer/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout management panel
        uses: actions/checkout@v4
        with:
          repository: Seekeer/Cli-Proxy-API-Management-Center
          ref: main
          path: management-panel
          persist-credentials: false
      - name: Prepare build metadata and panel context
        id: meta
        shell: bash
        run: |
          backend_sha=$(git rev-parse HEAD)
          panel_sha=$(git -C management-panel rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="b${backend_sha:0:12}-p${panel_sha:0:12}-r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mv management-panel "$RUNNER_TEMP/management-panel"
          rm -rf "$RUNNER_TEMP/management-panel/.git"
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "panel_sha=$panel_sha"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend with bundled panel
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          build-contexts: |
            panel=${{ runner.temp }}/management-panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.seekeer.management.revision=${{ steps.meta.outputs.panel_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write deployment reference
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PANEL_SHA: ${{ steps.meta.outputs.panel_sha }}
        run: |
          {
            echo '## Published image'
            echo "Tagged image: \`$IMAGE:$TAG\`"
            echo "Pinned image: \`$IMAGE@$DIGEST\`"
            echo "Backend: \`$GITHUB_SHA\`"
            echo "Panel: \`$PANEL_SHA\`"
            echo 'Set remote-management.disable-auto-update-panel to true to retain the bundled panel.'
          } >> "$GITHUB_STEP_SUMMARY"
